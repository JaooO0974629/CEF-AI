<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="CEF - Sistema industrial de controle e estocagem de ferramentas."
    />
    <title>CEF - Controle e Estocagem de Ferramentas</title>

    <link rel="stylesheet" href="./src/styles/tokens.css" />
    <link rel="stylesheet" href="./src/styles/reset.css" />
    <link rel="stylesheet" href="./src/styles/layout.css" />
    <link rel="stylesheet" href="./src/styles/components.css" />
    <link rel="stylesheet" href="./src/styles/print.css" />
  </head>

  <body>
    <div class="app-shell">
      <header class="app-header">
        <div class="app-header__inner">
          <div class="brand">
            <span class="brand__logo" aria-hidden="true">
              <svg class="icon" viewBox="0 0 24 24">
                <path
                  d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"
                />
              </svg>
            </span>
            <div class="brand__text">
              <h1 class="brand__name">CEF</h1>
              <p class="brand__tagline">SISTEMA INDUSTRIAL DE FERRAMENTAS</p>
            </div>
          </div>

          <div class="app-user">
            <div class="app-user__meta">
              <p class="app-user__name" id="current-user-name">Carlos Oliveira</p>
              <p class="app-user__role" id="current-user-role">Almoxarife Chefe</p>
            </div>
            <span class="avatar" id="current-user-avatar">CO</span>
          </div>
        </div>
      </header>

      <nav class="app-nav" aria-label="Navegação principal">
        <div class="app-nav__list custom-scroll" id="tab-list" role="tablist"></div>
      </nav>

      <main class="app-main" id="view-root"></main>

      <footer class="app-footer">
        <strong>CEF</strong> &middot; Controle e Estocagem de Ferramentas &middot; v2.0.0
      </footer>
    </div>

    <div id="modal-root"></div>
    <div class="toast-stack" id="toast-root" role="status" aria-live="polite"></div>
    <div class="print-root" id="print-root"></div>

    <noscript>
      <p style="padding: 24px; text-align: center">
        Este sistema necessita de JavaScript habilitado para funcionar.
      </p>
    </noscript>

    <script type="module" src="./src/js/main.js"></script>
  </body>
</html>
